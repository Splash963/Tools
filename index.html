    <script>
        function copyDemoCode() {
            const code = `FROM node:18-alpine\nWORKDIR /app\nCOPY package*.json ./\nRUN npm install\nEXPOSE 3000\nCMD ["npm", "start"]`;

            // Clipboard copy function safe for modern web standard
            const textArea = document.createElement("textarea");
            textArea.value = code;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);

            showToast();
        }

        function copyNotification() {
            showToast("Ready to add your new snippet!");
        }

        function showToast(msg = "Copied to clipboard!") {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }
    </script>
